name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: i686-unknown-linux-musl
          - runner: ubuntu-22.04
            target: armv7-unknown-linux-musleabihf
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
    container:
      image: ghcr.io/benfred/rust-musl-cross:${{ matrix.platform.target }}
      env:
        RUSTUP_HOME: /root/.rustup
        CARGO_HOME: /root/.cargo
    steps:
      - uses: actions/checkout@v4
      - name: Build Wheel
        run: |
          rustup toolchain uninstall stable && rustup toolchain install stable
          rustup target add ${{ matrix.platform.target }}
          python3 -m pip install --upgrade maturin
          maturin build --release -o dist --target ${{ matrix.platform.target }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '-C link-arg=-llzma'
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          before-script-linux: sudo apt-get update && sudo apt-get install -y libunwind-dev libunwind8 liblzma-dev
      - name: Run tests
        run: cargo test --verbose
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    permissions:
      # Used to attach the VSIX files to the GitHub release
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheels
      - name: Package platform-specific VSIX files
        working-directory: vscode
        run: |
          npm ci
          VERSION=$(grep -m1 '^version' ../Cargo.toml | cut -d'"' -f2)
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          mkdir -p ../dist-vsix
          # VS Code target <- wheel artifact holding the binary (musl builds also run on Alpine)
          while read -r target artifact; do
            rm -rf bin && mkdir bin
            unzip -o -j ../wheels/"$artifact"/*.whl '*.data/scripts/fadetop' '*.data/scripts/fadetop.exe' -d bin || true
            ls bin/fadetop bin/fadetop.exe 2>/dev/null | grep -q . || { echo "no fadetop binary in $artifact"; exit 1; }
            chmod +x bin/*
            npx vsce package --target "$target" -o ../dist-vsix/fadetop-"$target"-"$VERSION".vsix
          done <<'EOF'
          linux-x64 wheels-linux-x86_64-unknown-linux-musl
          alpine-x64 wheels-linux-x86_64-unknown-linux-musl
          linux-arm64 wheels-linux-aarch64-unknown-linux-musl
          alpine-arm64 wheels-linux-aarch64-unknown-linux-musl
          linux-armhf wheels-linux-armv7-unknown-linux-musleabihf
          win32-x64 wheels-windows-x64
          darwin-arm64 wheels-macos-aarch64
          EOF
      - name: Upload VSIX files
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist-vsix
      - name: Attach VSIX files to GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" dist-vsix/*.vsix --clobber

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
